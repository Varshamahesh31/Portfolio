    <style>
      /* Critical CSS for faster loading */
      body {
        font-family: "Inter", -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #241813;
      }
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #241813;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(198,155,50,0.2);
        border-top-color: #C69B32;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

    <div id="root">
      <!-- Loading Screen -->
      <div class="loading-screen">
